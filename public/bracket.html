<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match session - ROV Overlay Tool</title>
<!-- หน้านี้อยู่ที่ /tournament/:id/bracket ลึกสองชั้น
     path ทุกอันต้องขึ้นต้นด้วย / เท่านั้น -->
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/bracket.css">
</head>
<body>

<div class="topbar">
  <div class="logo">ROV <span>|</span> MATCH SESSION</div>
  <nav class="topnav" aria-label="Pages">
    <a class="tlink" href="/">HOME</a>
    <a class="tlink" href="/teams">TEAMS</a>
    <a class="tlink" href="/analytics">ANALYTICS</a>
    <a class="tlink" href="/control">CONTROL</a>
    <a class="tlink" href="/presets">PRESETS</a>
    <a class="tlink" href="/design">DESIGN</a>
    <a class="tlink" href="/hotkeys">HOTKEYS</a>
  </nav>
</div>

<!-- ตัวควบคุมการแข่งทั้งหมดอยู่ในแถบนี้แถบเดียว
     เดิมกระจายอยู่บนหน้าทัวร์นาเมนต์ ซึ่งเป็นหน้าตั้งค่าก่อนแข่ง คนละจังหวะการใช้งาน -->
<div class="bracket-head">
  <a class="tlink" id="backLink" href="/">&larr; TOURNAMENT</a>
  <div class="bracket-title" id="headName"></div>
  <div class="status-tags" id="headBadges"></div>
  <div class="spacer"></div>
  <label class="badge" id="randomiseLabel" style="cursor:pointer;display:flex;align-items:center;gap:6px;">
    <input type="checkbox" id="randomiseDraw"> Random draw
  </label>
  <button type="button" class="tlink primary" id="drawBtn">DRAW MATCHES</button>
  <button type="button" class="tlink danger" id="clearMatchesBtn" hidden>CLEAR</button>
</div>

<div class="bracket-subhead">
  <span class="bracket-hint">Click a match to put it on air. Type in the score boxes to record a result.</span>
</div>

<!-- เลื่อนแนวนอนได้ สายใหญ่ๆ กว้างเกินจอแน่นอน -->
<div class="bracket-scroll" id="bracketScroll">
  <div id="bracketBody"></div>
</div>

<div class="toast" id="toast_el"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/lib/app-client.js"></script>
<script src="/js/lib/team-ui.js"></script>
<script src="/js/bracket.js"></script>
</body>
</html>
