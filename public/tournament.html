<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tournament - ROV Overlay Tool</title>
<!-- หน้านี้เสิร์ฟที่ /tournament/:id ซึ่งลึกกว่าหน้าอื่นหนึ่งชั้น
     ทุก path ของ css/js จึงต้องขึ้นต้นด้วย / เสมอ ห้ามใช้ path สัมพัทธ์ -->
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div class="topbar">
  <div class="logo">ROV <span>|</span> OVERLAY TOOL</div>
  <nav class="topnav" aria-label="Pages">
    <a class="tlink" href="/" data-i18n>HOME</a>
    <a class="tlink" href="/teams" data-i18n>TEAMS</a>
    <a class="tlink" href="/analytics" data-i18n>ANALYTICS</a>
    <a class="tlink" href="/control" data-i18n>CONTROL</a>
    <a class="tlink" href="/design" data-i18n>DESIGN</a>
    <a class="tlink" href="/hotkeys" data-i18n>HOTKEYS</a>
    <a class="tlink" href="/guide" data-i18n>GUIDE</a>
  </nav>
</div>

<div class="wrap">

  <div class="section">
    <div class="section-head">
      <a class="tlink" data-esc-back href="/" data-i18n>&larr; ALL TOURNAMENTS</a>
      <div class="spacer"></div>
      <div class="status-tags" id="headBadges"></div>
    </div>
    <h1 class="tcard-name" id="headName" style="font-size:25px;"></h1>
  </div>

  <div class="section" id="detailSection" hidden>
    <div class="section-head">
      <div class="section-title" data-i18n>Tournament details</div>
    </div>
    <div class="panel">
      <div class="frow">
        <div class="fld">
          <label for="fName" data-i18n>Name</label>
          <input id="fName" type="text" maxlength="60" autocomplete="off">
        </div>
        <div class="fld">
          <label for="fFormat" data-i18n>Format</label>
          <select id="fFormat"></select>
          <span class="hint" id="formatHint"></span>
        </div>
        <div class="fld">
          <label for="fBestOf" data-i18n>Series length</label>
          <select id="fBestOf"></select>
        </div>
        <div class="fld">
          <label for="fStatus" data-i18n>Status</label>
          <select id="fStatus">
            <option value="active">Active</option>
            <option value="finished">Finished</option>
          </select>
        </div>
      </div>
      <div class="frow">
        <div class="fld wide">
          <label for="fNote" data-i18n>Note</label>
          <textarea id="fNote" maxlength="500"></textarea>
        </div>
      </div>
      <div class="frow">
        <button type="button" class="tlink primary" id="saveBtn" data-i18n>SAVE CHANGES</button>
        <button type="button" class="tlink" id="revertBtn" data-i18n>REVERT</button>
        <div class="spacer"></div>
        <button type="button" class="tlink danger" id="deleteBtn" data-i18n>DELETE TOURNAMENT</button>
      </div>
    </div>
  </div>

  <div class="section" id="teamsSection" hidden>
    <div class="section-head">
      <div class="section-title" data-i18n>Teams</div>
      <div class="status-tags" id="teamBadges"></div>
      <div class="spacer"></div>
      <button type="button" class="tlink primary" id="addTeamBtn" data-i18n>+ ADD TEAM</button>
      <!-- พับหัวข้อทีมเก็บได้ ทัวร์นาเมนต์ 128 ทีมทำให้ส่วนอื่นของหน้าหล่นไปอยู่ใต้สุด
           สถานะถูกจำไว้ใน localStorage คนที่จัดทีมเสร็จแล้วจะได้ไม่ต้องพับใหม่ทุกครั้ง -->
      <button type="button" class="tlink fold" id="teamsToggle"
              aria-expanded="true" aria-controls="teamsFold" title="Hide the team list">&#9662;</button>
    </div>

    <div id="teamsFold">

    <div class="panel" id="addPanel" hidden>
      <div class="frow">
        <div class="fld">
          <label for="pickTeam" data-i18n>Add a team already in the registry</label>
          <select id="pickTeam"></select>
        </div>
        <div class="fld" style="flex:0 0 auto;justify-content:flex-end;">
          <button type="button" class="tlink primary" id="addExistingBtn" data-i18n>ADD TO TOURNAMENT</button>
        </div>
      </div>
      <!-- สร้างทีมใหม่พร้อมผู้เล่นในฟอร์มเดียว
           เดิมต้องสร้างทีมเปล่าก่อนแล้วค่อยกด EDIT เพื่อใส่ผู้เล่น
           ซึ่งเป็นสองขั้นตอนทั้งที่คนกรอกมีข้อมูลครบอยู่ในมือแล้ว -->
      <div style="border-top:1px solid var(--border);padding-top:14px;">
        <div class="section-title" style="margin-bottom:10px;" data-i18n>…or create a new team</div>
        <div class="frow">
          <div class="fld">
            <label for="newTeamName" data-i18n>Team name</label>
            <input id="newTeamName" type="text" maxlength="24" placeholder="Flash Wolves" autocomplete="off" data-i18n-placeholder>
          </div>
          <div class="fld" style="flex:0 0 130px;">
            <label for="newTeamTag" data-i18n>Tag</label>
            <input id="newTeamTag" type="text" maxlength="6" placeholder="FW" autocomplete="off" data-i18n-placeholder>
          </div>
          <div class="fld" style="flex:0 0 auto;justify-content:flex-end;">
            <button type="button" class="tlink" id="newTeamLogoBtn" data-i18n>CHOOSE LOGO</button>
          </div>
        </div>

        <label class="fld" style="margin-bottom:8px;"><span>Players</span></label>
        <div id="newTeamPlayers"></div>

        <div class="frow" style="margin-top:12px;">
          <button type="button" class="tlink primary" id="createTeamBtn" data-i18n>CREATE &amp; ADD</button>
          <button type="button" class="tlink" id="clearNewTeamBtn" data-i18n>CLEAR FORM</button>
          <div class="spacer" style="margin-left:auto;"></div>
          <button type="button" class="tlink" id="closeAddBtn" data-i18n>CLOSE</button>
        </div>
      </div>
    </div>

    <div id="teamsBody"></div>

    </div>
  </div>

  <!-- การแข่งขันย้ายไปอยู่หน้าของตัวเองแล้ว (/tournament/:id/bracket)
       หน้านี้เหลือไว้แค่การตั้งค่าก่อนแข่ง: รายละเอียด ทีม และ URL สำหรับ OBS
       ตรงนี้จึงมีแค่ทางเข้ากับตัวเลขบอกความคืบหน้า ไม่มีตัวควบคุมการแข่งแล้ว -->
  <div class="section" id="matchesSection" hidden>
    <div class="section-head">
      <div class="section-title" data-i18n>Match session</div>
      <div class="status-tags" id="matchBadges"></div>
      <div class="spacer"></div>
      <a class="tlink primary" id="bracketLink" href="#" data-i18n>OPEN MATCH SESSION</a>
    </div>
    <div id="matchesBody"></div>
  </div>

  <div class="section" id="obsSection" hidden>
    <div class="section-head">
      <div class="section-title" data-i18n>OBS browser sources</div>
    </div>
    <div id="sources"></div>
  </div>

  <div class="foot" id="foot"></div>

</div>

<div class="toast" id="toast_el"></div>

<script src="/js/lib/i18n.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/lib/app-client.js"></script>
<script src="/js/lib/team-ui.js"></script>
<script src="/js/lib/tournament-ui.js"></script>
<script src="/js/lib/obs-sources.js"></script>
<script src="/js/tournament.js"></script>
</body>
</html>
