<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team - ROV Overlay Tool</title>
<!-- หน้านี้เสิร์ฟที่ /teams/:id ซึ่งลึกกว่าหน้าอื่นหนึ่งชั้น
     ทุก path ของ css/js จึงต้องขึ้นต้นด้วย / เสมอ ห้ามใช้ path สัมพัทธ์
     ไม่งั้นเบราว์เซอร์จะไปหาที่ /teams/js/... แล้วได้ 404 -->
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div class="topbar">
  <div class="logo">ROV <span>|</span> OVERLAY TOOL</div>
  <nav class="topnav" aria-label="Pages">
    <a class="tlink" href="/" data-i18n>HOME</a>
    <a class="tlink active" href="/teams" aria-current="page" data-i18n>TEAMS</a>
    <a class="tlink" href="/analytics" data-i18n>ANALYTICS</a>
    <a class="tlink" href="/control" data-i18n>CONTROL</a>
    <a class="tlink" href="/design" data-i18n>DESIGN</a>
    <a class="tlink" href="/hotkeys" data-i18n>HOTKEYS</a>
    <a class="tlink" href="/guide" data-i18n>GUIDE</a>
  </nav>
</div>

<div class="wrap">

  <div class="section">
    <div class="section-head">
      <a class="tlink" data-esc-back href="/teams" data-i18n>&larr; ALL TEAMS</a>
      <div class="spacer"></div>
      <div class="status-tags" id="headBadges"></div>
    </div>
    <div class="team-head" id="teamHead"></div>
  </div>

  <div class="section" id="detailSection" hidden>
    <div class="section-head">
      <div class="section-title" data-i18n>Team details</div>
    </div>
    <div class="panel">
      <div class="frow">
        <div class="fld">
          <label for="fName" data-i18n>Team name</label>
          <input id="fName" type="text" maxlength="24" autocomplete="off">
        </div>
        <div class="fld" style="flex:0 0 130px;">
          <label for="fTag" data-i18n>Tag</label>
          <input id="fTag" type="text" maxlength="6" autocomplete="off">
        </div>
      </div>

      <label class="fld" style="margin-bottom:8px;"><span>Players</span></label>
      <div id="playerRows"></div>

      <div class="frow" style="margin-top:12px;align-items:center;">
        <button type="button" class="tlink" id="uploadLogoBtn" data-i18n>UPLOAD LOGO</button>
        <button type="button" class="tlink" id="clearLogoBtn" data-i18n>CLEAR LOGO</button>
        <span class="hint">PNG, JPG or WEBP, up to 4 MB</span>
      </div>

      <div class="frow" style="margin-bottom:0;">
        <button type="button" class="tlink primary" id="saveBtn" data-i18n>SAVE CHANGES</button>
        <button type="button" class="tlink" id="revertBtn" data-i18n>REVERT</button>
        <div class="spacer" style="margin-left:auto;"></div>
        <button type="button" class="tlink danger" id="deleteBtn" data-i18n>DELETE TEAM</button>
      </div>
    </div>
  </div>

  <div class="section" id="tournamentsSection" hidden>
    <div class="section-head">
      <div class="section-title" data-i18n>Tournaments</div>
    </div>
    <div id="tournamentsBody"></div>
  </div>

  <div class="section" id="historySection" hidden>
    <div class="section-head">
      <div class="section-title" data-i18n>Match history</div>
      <div class="spacer"></div>
      <span class="bracket-hint" id="historyHint"></span>
    </div>
    <div id="historyBody"></div>
  </div>

  <div class="foot" id="foot"></div>

</div>

<div class="toast" id="toast_el"></div>

<script src="/js/lib/i18n.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/lib/app-client.js"></script>
<script src="/js/lib/team-ui.js"></script>
<script src="/js/team.js"></script>
</body>
</html>
