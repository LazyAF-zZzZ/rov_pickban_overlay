<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROV Presets</title>
<style>
:root{--bg:#0b0c14;--s1:#111220;--s2:#181929;--s3:#1e2035;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--blue:#3b82f6;--red:#ef4444;--gold:#f59e0b;--green:#10b981;--purple:#8b5cf6;--text:#e2e8f0;--muted:#4a5568;--muted2:#64748b;--hf:'Arial Narrow','Segoe UI Condensed','Segoe UI',Arial,sans-serif;--bf:'Segoe UI',Arial,sans-serif;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--bf);background:var(--bg);color:var(--text);min-height:100vh;}

.topbar{background:var(--s1);border-bottom:1px solid var(--border);padding:0 18px;height:50px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100;}
.logo{font-family:var(--hf);font-size:18px;font-weight:900;letter-spacing:3px;color:var(--purple);white-space:nowrap;}
.logo span{color:rgba(255,255,255,0.3);}
/* PAGE NAV - identical markup, order and styling on all four pages, so the
   same button is always in the same place. The current page is marked rather
   than removed, so the row never changes width as you move between pages. */
.topnav{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.topnav .tlink.active{background:var(--s1);color:var(--text);border-color:var(--blue);cursor:default;}
.topnav .tlink.active:hover{color:var(--text);border-color:var(--blue);}
.tlink{padding:5px 13px;border-radius:6px;font-family:var(--hf);font-size:12px;font-weight:800;letter-spacing:1px;cursor:pointer;border:1px solid var(--border2);background:var(--s3);color:var(--muted2);transition:all 0.2s;text-decoration:none;}
.tlink:hover{color:var(--blue);border-color:var(--blue);}

.wrap{max-width:1100px;margin:0 auto;padding:18px 14px 60px;}
.panel{background:var(--s1);border-radius:12px;border:1px solid var(--border);overflow:hidden;margin-bottom:14px;}
.panel.save-panel{border-top:3px solid var(--green);}
.panel.list-panel{border-top:3px solid var(--purple);}
.panel-head{display:flex;align-items:center;gap:10px;padding:11px 16px;background:var(--s2);border-bottom:1px solid var(--border);flex-wrap:wrap;}
.panel-title{font-family:var(--hf);font-size:15px;font-weight:900;letter-spacing:2px;text-transform:uppercase;}
.panel-note{font-size:11px;color:var(--muted);margin-left:auto;}
.panel-body{padding:16px;}

/* EDITOR FORM */
.bbtn{padding:9px 18px;border-radius:8px;border:none;font-family:var(--hf);font-size:13px;font-weight:800;letter-spacing:1px;cursor:pointer;color:#fff;white-space:nowrap;transition:filter 0.15s;}
.bbtn:hover{filter:brightness(1.15);}
.bbtn.save{background:var(--green);}
.bbtn.load{background:var(--blue);}
.bbtn.edit{background:var(--s3);color:var(--text);border:1px solid var(--border2);}
.bbtn.edit:hover{color:#fff;border-color:var(--blue);background:var(--blue);filter:none;}
.bbtn.ghost{background:var(--s3);color:var(--muted2);border:1px solid var(--border2);}
.bbtn.ghost:hover{color:var(--text);border-color:var(--border2);filter:none;}

.field label{display:block;font-size:10px;letter-spacing:1.5px;color:var(--muted2);text-transform:uppercase;margin-bottom:5px;}
.field .req{color:var(--muted);letter-spacing:0.5px;text-transform:none;font-size:10px;}
.field input{width:100%;padding:9px 11px;background:var(--s3);border:1px solid var(--border2);color:var(--text);border-radius:8px;font-family:var(--bf);font-size:13px;font-weight:600;transition:border-color 0.15s;}
.field input:focus{outline:none;border-color:var(--green);}

.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px;}
.form-grid .wide{grid-column:1/-1;}

.teams-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.team-col{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:13px;}
.team-col.blue{border-top:2px solid var(--blue);}
.team-col.red{border-top:2px solid var(--red);}
.team-col-head{font-family:var(--hf);font-size:12px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:11px;}
.team-col.blue .team-col-head{color:#7dd3fc;}
.team-col.red .team-col-head{color:#fca5a5;}
.players{display:flex;flex-direction:column;gap:6px;margin-top:11px;}
.prow{display:flex;align-items:center;gap:8px;}
.pnum{flex:0 0 18px;font-family:var(--hf);font-size:11px;font-weight:800;color:var(--muted);text-align:center;}
.prow input{flex:1;min-width:0;padding:7px 10px;background:var(--s3);border:1px solid var(--border2);color:var(--text);border-radius:7px;font-family:var(--bf);font-size:13px;font-weight:600;}
.prow input:focus{outline:none;border-color:var(--green);}

.form-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:16px;}
.save-hint{font-size:11px;color:var(--muted);line-height:1.5;}
.editing .panel-head{background:rgba(59,130,246,0.12);}

/* SEARCH */
.list-search{flex:0 0 200px;padding:6px 10px;background:var(--s3);border:1px solid var(--border2);color:var(--text);border-radius:7px;font-family:var(--bf);font-size:12px;font-weight:600;}
.list-search:focus{outline:none;border-color:var(--purple);}

/* PRESET CARDS */
.preset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;}
.pcard{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:13px 14px;display:flex;flex-direction:column;gap:10px;transition:border-color 0.15s;}
.pcard:hover{border-color:var(--border2);}
.pcard-top{display:flex;align-items:flex-start;gap:8px;}
.pcard-name{font-family:var(--hf);font-size:16px;font-weight:900;letter-spacing:0.5px;color:var(--text);word-break:break-word;flex:1;min-width:0;}
.pcard-del{flex:0 0 auto;width:26px;height:26px;line-height:1;background:none;border:1px solid transparent;color:var(--muted);border-radius:6px;font-size:17px;cursor:pointer;transition:all 0.15s;}
.pcard-del:hover{color:#fff;background:var(--red);border-color:var(--red);}
.pcard-meta{font-size:11px;color:var(--muted2);line-height:1.6;word-break:break-word;}
.pcard-meta b{color:var(--text);font-weight:600;}
.pcard-teams{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--s3);border-radius:8px;}
.pteam{flex:1;min-width:0;font-family:var(--hf);font-size:13px;font-weight:800;letter-spacing:0.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pteam.blue{color:#7dd3fc;}
.pteam.red{color:#fca5a5;text-align:right;}
.pscore{flex:0 0 auto;font-family:var(--hf);font-size:15px;font-weight:900;color:var(--text);letter-spacing:1px;}
.pcard-roster{display:flex;flex-direction:column;gap:3px;font-size:11px;line-height:1.5;}
.proster{display:flex;gap:6px;min-width:0;}
.proster-tag{flex:0 0 auto;font-family:var(--hf);font-size:10px;font-weight:800;letter-spacing:0.5px;padding-top:1px;}
.proster.blue .proster-tag{color:#7dd3fc;}
.proster.red .proster-tag{color:#fca5a5;}
.proster-names{flex:1;min-width:0;color:var(--muted2);word-break:break-word;}
.pcard-draft{font-size:10px;color:var(--muted);letter-spacing:0.5px;}
.pcard-actions{display:flex;gap:8px;}
.pcard-actions .bbtn{flex:1;padding:7px 12px;font-size:12px;}

.empty-state{padding:38px 16px;text-align:center;color:var(--muted);}
.empty-state .es-title{font-family:var(--hf);font-size:15px;font-weight:800;letter-spacing:1.5px;color:var(--muted2);margin-bottom:6px;}
.empty-state .es-sub{font-size:12px;line-height:1.6;}

/* pointer-events:none matters - at opacity 0 the toast is invisible but
   still hit-testable, and it would swallow clicks near the bottom edge. */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--s2);border:1px solid var(--border2);border-left:3px solid var(--green);color:var(--text);padding:11px 18px;border-radius:8px;font-size:13px;font-weight:600;opacity:0;transition:all 0.25s;z-index:300;box-shadow:0 8px 26px rgba(0,0,0,0.55);pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* CONFIRM DIALOG
   In-page, not window.confirm(). The native dialog is modal to the whole
   renderer in Electron and leaves the window unable to take keyboard input
   after it closes - typing into any field stops working until you click
   away and back. This one is just DOM. */
.modal-backdrop{position:fixed;inset:0;background:rgba(3,5,12,0.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:400;}
.modal-backdrop[hidden]{display:none;}
.modal{background:var(--s1);border:1px solid var(--border2);border-radius:12px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.6);overflow:hidden;}
.modal-title{padding:14px 18px;background:var(--s2);border-bottom:1px solid var(--border);font-family:var(--hf);font-size:15px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;}
.modal-body{padding:16px 18px;font-size:13px;line-height:1.65;color:var(--muted2);word-break:break-word;}
.modal-body b{color:var(--text);font-weight:700;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;padding:0 18px 16px;}
.bbtn.danger{background:var(--red);}
.bbtn.confirm{background:var(--blue);}

@media (max-width:640px){
  .topbar{flex-wrap:wrap;height:auto;padding:8px 12px;}
  .topnav{margin-left:0;width:100%;}
  .preset-grid{grid-template-columns:1fr;}
  .form-grid,.teams-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">ROV <span>|</span> PRESETS</div>
  <nav class="topnav" aria-label="Pages">
    <a class="tlink" href="/">HOME</a>
    <a class="tlink" href="/teams">TEAMS</a>
    <a class="tlink" href="/analytics">ANALYTICS</a>
    <a class="tlink" href="/control">CONTROL</a>
    <a class="tlink active" href="/presets" aria-current="page">PRESETS</a>
    <a class="tlink" href="/design">DESIGN</a>
    <a class="tlink" href="/hotkeys">HOTKEYS</a>
  </nav>
</div>

<div class="wrap">

  <div class="panel save-panel">
    <div class="panel-head">
      <div class="panel-title" id="editorTitle">New preset</div>
      <span class="panel-note" id="editorNote">Type the line-up. Nothing is read from the live match.</span>
    </div>
    <div class="panel-body">

      <div class="form-grid">
        <div class="field wide">
          <label for="presetName">Preset name <span class="req">required</span></label>
          <input id="presetName" placeholder="e.g. Grand Final - FW vs EA" maxlength="40" autocomplete="off">
        </div>
        <div class="field">
          <label for="fTournament">Tournament</label>
          <input id="fTournament" placeholder="e.g. ROV Pro League 2026" maxlength="50" autocomplete="off">
        </div>
        <div class="field">
          <label for="fTitle">Match title</label>
          <input id="fTitle" placeholder="e.g. FW VS EA : GAME 3 [BO7]" maxlength="80" autocomplete="off">
        </div>
      </div>

      <div class="teams-grid">
        <div class="team-col blue">
          <div class="team-col-head">Blue team</div>
          <div class="field">
            <label for="fBlueName">Team name</label>
            <input id="fBlueName" placeholder="BLUE" maxlength="24" autocomplete="off">
          </div>
          <div class="players" id="bluePlayers"></div>
        </div>
        <div class="team-col red">
          <div class="team-col-head">Red team</div>
          <div class="field">
            <label for="fRedName">Team name</label>
            <input id="fRedName" placeholder="RED" maxlength="24" autocomplete="off">
          </div>
          <div class="players" id="redPlayers"></div>
        </div>
      </div>

      <div class="form-actions">
        <button class="bbtn save" type="button" onclick="savePreset()" id="saveBtn">SAVE PRESET</button>
        <button class="bbtn ghost" type="button" onclick="resetForm()" id="resetBtn">CLEAR FORM</button>
        <span class="save-hint" id="saveHint"></span>
      </div>

    </div>
  </div>

  <div class="panel list-panel">
    <div class="panel-head">
      <div class="panel-title">Saved presets</div>
      <span class="panel-note" id="presetCount"></span>
      <input class="list-search" id="presetSearch" placeholder="Search..." autocomplete="off">
    </div>
    <div class="panel-body">
      <div class="preset-grid" id="presetGrid"></div>
    </div>
  </div>

</div>

<div class="modal-backdrop" id="confirmModal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle" hidden>
  <div class="modal">
    <div class="modal-title" id="confirmTitle"></div>
    <div class="modal-body" id="confirmBody"></div>
    <div class="modal-actions">
      <button class="bbtn ghost" type="button" id="confirmCancel">CANCEL</button>
      <button class="bbtn confirm" type="button" id="confirmOk">CONFIRM</button>
    </div>
  </div>
</div>

<div class="toast" id="toast_el"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="js/lib/app-client.js"></script>
<script src="js/presets.js"></script>
</body>
</html>
