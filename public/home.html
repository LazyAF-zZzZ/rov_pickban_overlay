<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROV Overlay Tool</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div class="topbar">
  <div class="logo">ROV <span>|</span> OVERLAY TOOL</div>
  <nav class="topnav" aria-label="Pages">
    <a class="tlink active" href="/" aria-current="page" data-i18n>HOME</a>
    <a class="tlink" href="/teams" data-i18n>TEAMS</a>
    <a class="tlink" href="/analytics" data-i18n>ANALYTICS</a>
    <a class="tlink" href="/control" data-i18n>CONTROL</a>
    <a class="tlink" href="/design" data-i18n>DESIGN</a>
    <a class="tlink" href="/hotkeys" data-i18n>HOTKEYS</a>
    <a class="tlink" href="/guide" data-i18n>GUIDE</a>
  </nav>
</div>

<div class="wrap">

  <div class="status" id="status">
    <span class="status-dot"></span>
    <span class="status-label" id="statusLabel">Connecting</span>
    <div class="status-match" id="statusMatch"></div>
    <div class="status-tags" id="statusTags"></div>
  </div>

  <!-- หน้าแรกคือรายการทัวร์นาเมนต์ เครื่องมืออื่นเข้าถึงได้จากแถบบน -->
  <div class="section">
    <div class="section-head">
      <div class="section-title" data-i18n>Tournaments</div>
      <div class="spacer"></div>
      <button type="button" class="tlink primary" id="newBtn" data-i18n>+ NEW TOURNAMENT</button>
    </div>

    <div class="panel" id="createPanel" hidden>
      <div class="frow">
        <div class="fld">
          <label for="fName" data-i18n>Tournament name</label>
          <input id="fName" type="text" maxlength="60" placeholder="ROV Premier League 2026" autocomplete="off" data-i18n-placeholder>
        </div>
        <div class="fld">
          <label for="fFormat" data-i18n>Format</label>
          <select id="fFormat"></select>
          <span class="hint" id="formatHint"></span>
        </div>
        <div class="fld">
          <label for="fBestOf" data-i18n>Series length</label>
          <select id="fBestOf"></select>
        </div>
      </div>
      <div class="frow">
        <div class="fld wide">
          <label for="fNote" data-i18n>Note (optional)</label>
          <textarea id="fNote" maxlength="500" placeholder="Venue, dates, anything you want to remember"></textarea>
        </div>
      </div>
      <div class="frow">
        <button type="button" class="tlink primary" id="createBtn" data-i18n>CREATE</button>
        <button type="button" class="tlink" id="cancelBtn" data-i18n>CANCEL</button>
      </div>
    </div>

    <div id="tournamentList"></div>
  </div>

  <!-- สำรองข้อมูลและกู้คืน
       อยู่ท้ายหน้าแรกเพราะเป็นงานที่ทำนอกเวลาแข่ง ไม่ใช่ระหว่างคุมงาน
       และไม่ได้เพิ่มลงแถบเมนู เพราะแถบเมนูต้องเหมือนกันทุกหน้า (มีเทสต์คุมอยู่) -->
  <div class="section" id="backupSection">
    <div class="section-head">
      <div class="section-title" data-i18n>Backup</div>
      <div class="spacer"></div>
      <button type="button" class="tlink" id="backupBtn" data-i18n>SAVE A BACKUP</button>
      <button type="button" class="tlink" id="restoreBtn" data-i18n>RESTORE…</button>
    </div>
    <div class="panel">
      <div class="panel-body">
        <div class="hint" data-i18n>Everything on this machine — teams, logos, brackets and every recorded draft — saved as one file you can keep somewhere else or move to another PC.</div>
        <div id="restorePreview" hidden></div>
      </div>
    </div>
  </div>

  <div class="foot" id="foot"></div>

</div>

<div class="toast" id="toast_el"></div>

<script src="/js/lib/i18n.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/lib/app-client.js"></script>
<script src="/js/lib/tournament-ui.js"></script>
<script src="/js/home.js"></script>
</body>
</html>
