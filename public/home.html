<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROV Overlay Tool</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div class="topbar">
  <div class="logo">ROV <span>|</span> OVERLAY TOOL</div>
  <nav class="topnav" aria-label="Pages">
    <a class="tlink active" href="/" aria-current="page">HOME</a>
    <a class="tlink" href="/teams">TEAMS</a>
    <a class="tlink" href="/analytics">ANALYTICS</a>
    <a class="tlink" href="/control">CONTROL</a>
    <a class="tlink" href="/presets">PRESETS</a>
    <a class="tlink" href="/design">DESIGN</a>
    <a class="tlink" href="/hotkeys">HOTKEYS</a>
  </nav>
</div>

<div class="wrap">

  <div class="status" id="status">
    <span class="status-dot"></span>
    <span class="status-label" id="statusLabel">Connecting</span>
    <div class="status-match" id="statusMatch"></div>
    <div class="status-tags" id="statusTags"></div>
  </div>

  <!-- หน้าแรกคือรายการทัวร์นาเมนต์ เครื่องมืออื่นเข้าถึงได้จากแถบบน -->
  <div class="section">
    <div class="section-head">
      <div class="section-title">Tournaments</div>
      <div class="spacer"></div>
      <button type="button" class="tlink primary" id="newBtn">+ NEW TOURNAMENT</button>
    </div>

    <div class="panel" id="createPanel" hidden>
      <div class="frow">
        <div class="fld">
          <label for="fName">Tournament name</label>
          <input id="fName" type="text" maxlength="60" placeholder="ROV Premier League 2026" autocomplete="off">
        </div>
        <div class="fld">
          <label for="fFormat">Format</label>
          <select id="fFormat"></select>
          <span class="hint" id="formatHint"></span>
        </div>
        <div class="fld">
          <label for="fBestOf">Series length</label>
          <select id="fBestOf"></select>
        </div>
      </div>
      <div class="frow">
        <div class="fld wide">
          <label for="fNote">Note (optional)</label>
          <textarea id="fNote" maxlength="500" placeholder="Venue, dates, anything you want to remember"></textarea>
        </div>
      </div>
      <div class="frow">
        <button type="button" class="tlink primary" id="createBtn">CREATE</button>
        <button type="button" class="tlink" id="cancelBtn">CANCEL</button>
      </div>
    </div>

    <div id="tournamentList"></div>
  </div>

  <div class="foot" id="foot"></div>

</div>

<div class="toast" id="toast_el"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/lib/app-client.js"></script>
<script src="/js/home.js"></script>
</body>
</html>
